<!DOCTYPE html>
<html lang="en-IN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Stock Picker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@700&family=Montserrat&family=Nunito:wght@200&display=swap"
        rel="stylesheet">
    <style>
        html {
            height: 100%;
        }

        body {
            background-color: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }

        quote {
            font-family: 'Montserrat', sans-serif;
            color: white;
            font-size: 5em;
            cursor: pointer;
            text-transform: uppercase;
            /* overflow-y: clip; */
        }



        button {
            text-decoration: none;
            font-family: 'Lato', sans-serif;
            font-size: 1em;
            color: ghostwhite;
            background: cornflowerblue;
            border-color: cornflowerblue;
            border-width: 0;
            padding: 1em 2em;
            border-radius: 0.5em;
            font-weight: normal;
            text-transform: uppercase;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        button:hover {
            background-color: royalblue;
            color: darkturquoise;
        }

        header {
            font-family: 'Nunito', sans-serif;
            font-size: 2em;
            color: white;
            text-align: center;
            padding: 1em;
        }

        footer {
            font-family: 'Nunito', sans-serif;
            font-size: 0.7em;
            color: white;
            text-align: center;
            text-transform: capitalize;
            margin-bottom: 3em;
        }
        .inner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: space-around;
            height: 100%;
            justify-content: space-around;
        }
        @media screen and (max-width: 600px) {
            header{
                font-size: 1.4em;
            }
  quote {
    font-size: 2em;
    font-weight: bolder;
  }
}
    </style>
    <script>
        let quotes = [];

        const getQuoteNode = () => document.querySelector('quote');

        const updateQuoteDisplay = (symbol) => {
            const node = getQuoteNode();
            if (!node) {
                return;
            }

            const link = `https://www.nseindia.com/get-quotes/equity?symbol=${encodeURIComponent(symbol)}`;
            node.innerText = symbol;
            node.onclick = () => window.open(link);
        };

        const randomMize = () => {
            if (quotes.length) {
                const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
                updateQuoteDisplay(randomQuote);
                return;
            }

            const node = getQuoteNode();
            if (node) {
                node.innerText = 'No symbols available';
                node.onclick = null;
            }
        };

        const loadSymbols = async () => {
            const node = getQuoteNode();
            if (node) {
                node.innerText = 'Loading NSE symbols...';
                node.onclick = null;
            }

            try {
                const response = await fetch('data/nse_symbols.json', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Unexpected response ${response.status}`);
                }

                const payload = await response.json();
                const fetched = Array.isArray(payload)
                    ? payload
                    : Array.isArray(payload.symbols)
                        ? payload.symbols
                        : [];

                if (!fetched.length) {
                    throw new Error('No symbols in payload');
                }

                quotes = fetched;
                randomMize();
                return;
            } catch (error) {
                console.error('Unable to load NSE symbols', error);
            }

            const node = getQuoteNode();
            if (node) {
                node.innerText = 'Unable to load NSE symbols';
                node.onclick = null;
            }
        };

        window.randomMize = randomMize;
        window.onload = loadSymbols;
    </script>
</head>

<body>
    <header>Tired of researching and choosing stocks? Try this random stock picker which will relieve you from all
        hardwork.</header>
    <div
    class="inner-container"
    >

        <quote>EMPTY</quote>
        <button onclick="randomMize()">Refresh</button>
        <a href="https://zerodha.com/?c=PRY078&s=CONSOLE" target="_blank">
            <button style="background-color: darkslateblue;">
                Buy
            </button>
        </a>
    </div>
    <footer>Your ₹money₹, your risk</footer>

</body>

</html>
